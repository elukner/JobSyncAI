[workspace]
channels = ["conda-forge"]
name = "backend"
platforms = ["osx-arm64", "win-64", "osx-64", "linux-64"]
version = "0.1.0"

[tasks]
dev = "uvicorn app.main:app --reload --port 8000"

[dependencies]
python = "3.11.*"

[pypi-dependencies]
fastapi = ">=0.162.0, <0.163"
uvicorn = ">=0.54.0, <0.55"
pydantic = ">=2.14.1, <3"
openai = ">=3.37.0, <4"
pypdf = ">=6.21.2, <7"
python-multipart = ">=0.0.32, <0.0.33"
supabase = ">=2.33.0, <3"
python-dotenv = ">=1.2.4, <2"
httpx = ">=0.28.1, <0.29"
pydantic-settings = ">=2.16.1, <3"
